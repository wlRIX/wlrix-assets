<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- IRIX's red check, for the GTK check box. The same shapes as Wlrix.Avalonia's CheckBox.axaml,
       which draws them from _docs/svg-icons/check.svg scaled into a 15px box: two red strokes
       edged a pixel in their own red for weight, and a black line under the long one only. The
       view box is a pixel wider than the box so the tip reaches the corner, as IRIX's did.

       This comment is inside the root element on purpose: before it, it pushed `<svg` past
       the first bytes glycin sniffs to recognize a format, and gdk-pixbuf refused the file as
       an unknown format, so the check box drew no check at all. -->
  <g fill="#ff0000" stroke="#ff0000" stroke-width="1" stroke-linejoin="miter">
    <path d="M4.49,5.51 L6.31,6.13 L7.22,6.62 L9.33,8.44 L9.48,9.77 L7.36,11.22 L6.71,9.68 L6.14,8.93 L5.11,8.49 L4.10,8.29 L2.99,8.21 L1.50,8.33 Z"/>
    <path d="M7.68,7.01 L8.29,6.42 L9.51,5.39 L10.64,4.63 L12.08,3.74 L15.99,1.50 L15.03,3.57 L12.29,5.55 L10.76,6.67 L9.38,8.37 L8.09,10.09 Z"/>
  </g>
  <path d="M15.03,3.57 L12.29,5.55 L10.76,6.67 L9.38,8.37 L9.48,9.77 L7.35,11.21 L6.60,12.20"
        fill="none" stroke="#000000" stroke-width="1"/>
</svg>
